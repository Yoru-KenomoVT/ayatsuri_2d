[package]
name = "ayatsuri-import"
description = "Imports foreign formats into the puppet model: .moc3 today, PSD later"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ayatsuri-format = { workspace = true }
openmoc3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# paint documents in: Photoshop through `psd`, Krita's zip through `zip`
psd = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
