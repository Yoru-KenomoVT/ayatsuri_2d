<g transform="translate(215 270)"><rect class="box" x="0" y="0" width="175" height="130" rx="8"/><circle cx="117" cy="65" r="34" fill="#f08e1e"/></g>
<g transform="translate(410 270)"><rect x="0" y="0" width="175" height="130" rx="8" fill="#000"/><ellipse cx="87" cy="65" rx="60" ry="32" fill="#4cc06a"/></g>
<g transform="translate(605 270)"><rect class="box" x="0" y="0" width="175" height="130" rx="8"/><ellipse cx="87" cy="65" rx="60" ry="32" fill="none" stroke="#8e8e96" stroke-dasharray="4 4"/><circle cx="117" cy="65" r="34" fill="#f08e1e" mask="url(#noteye)"/></g></g>
