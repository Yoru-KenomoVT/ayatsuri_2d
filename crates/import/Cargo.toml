[package]
name = "ayatsuri-import"
description = "Imports foreign formats into the puppet model: .moc3 today, PSD later"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ayatsuri-core = { workspace = true }
ayatsuri-format = { workspace = true }
openmoc3 = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# paint documents in: Photoshop through `psd`, Krita's zip through `zip`
psd = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Clip Studio tiles and Cubism project zips are deflate streams
miniz_oxide = { workspace = true }
# Cubism Editor projects keep their object graph as XML
quick-xml = "0.41"
