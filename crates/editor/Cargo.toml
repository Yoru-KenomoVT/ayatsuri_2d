[package]
name = "ayatsuri-editor"
description = "The egui editor frontend: panels, viewport, parameters, timeline"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pollster = "0.4"
tungstenite = "0.30"
ayatsuri-core = { workspace = true }
ayatsuri-format = { workspace = true }
ayatsuri-render = { workspace = true }
ayatsuri-import = { workspace = true }
ayatsuri-update = { workspace = true }
sys-locale = "0.3"
openmoc3 = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
rmp-serde = { workspace = true }
miniz_oxide = { workspace = true }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
egui-phosphor = "0.14.0"
discord-rich-presence = "1.1"
# decoding only (WAV, MP3, FLAC, Ogg); the output is ours, below
rodio = { version = "0.23", default-features = false, features = ["flac", "mp3", "vorbis", "wav"] }
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
# the PulseAudio protocol in pure Rust: PipeWire's pipewire-pulse answers it
pulseaudio = "0.3.1"
