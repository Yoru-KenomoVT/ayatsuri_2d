[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.5.5"
edition = "2024"
license = "GPL-3.0"
authors = ["Yoru_KenomoVT"]
description = "An open, native 2D puppet studio: rig, animate and run Live2D-style models"
repository = "https://github.com/Yoru-KenomoVT/ayatsuri_2d"
homepage = "https://github.com/Yoru-KenomoVT/ayatsuri_2d"

[workspace.dependencies]
# internal
ayatsuri-format = { path = "crates/format" }
ayatsuri-core = { path = "crates/core" }
ayatsuri-render = { path = "crates/render" }
ayatsuri-capi = { path = "crates/capi" }
ayatsuri-editor = { path = "crates/editor" }
ayatsuri-import = { path = "crates/import" }
ayatsuri-update = { path = "crates/update" }
openmoc3 = { path = "crates/openmoc3" }

# foundation
serde = { version = "1", features = ["derive"] }
# preserve_order: written Cubism JSON keeps its keys in the published order
# (Version first) instead of sorted, which strict loaders expect
serde_json = { version = "1", features = ["preserve_order"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
bytemuck = { version = "1", features = ["derive"] }
miniz_oxide = "0.9"
thiserror = "2"
log = "0.4"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui-wgpu = "0.36"
wgpu = "30"

[workspace.lints.rust]
unsafe_code = "forbid"

# Never crashes (docs/goals.md): a model file is hostile input, and the runtime
# path forbids panics by lint rather than by discipline. Tests are exempt via
# clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "warn"
dbg_macro = "warn"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# line tables only: crash backtraces name file and line, binary stays lean
debug = "line-tables-only"
