[package]
name = "ayatsuri"
description = "The Ayatsuri2D desktop app"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
ayatsuri-core = { workspace = true }
ayatsuri-import = { workspace = true }
ayatsuri-format = { workspace = true }
openmoc3 = { workspace = true }
psd = "0.3"

[dependencies]
ayatsuri-editor = { workspace = true }
ayatsuri-render = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# only here to switch on "links": without it ctx.open_url (About, Discord
# and GitHub buttons) logs a warning and does nothing
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
log = { workspace = true }
# decodes the window icon
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"
