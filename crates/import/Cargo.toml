[package]
name = "ayatsuri-import"
description = "Imports foreign formats into the puppet model: .moc3 today, PSD later"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["documents"]
# Paint documents (PSD, Krita, Clip Studio) and Cubism Editor projects
# (cmo3), with the image, zip and XML crates they need. Off, the crate is
# moc3 plus the Cubism JSON files only, which is what the C ABI compiles.
documents = ["dep:psd", "dep:zip", "dep:image", "dep:miniz_oxide", "dep:quick-xml"]

[dependencies]
ayatsuri-core = { workspace = true }
ayatsuri-format = { workspace = true }
openmoc3 = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# paint documents in: Photoshop through `psd`, Krita's zip through `zip`
psd = { version = "0.3", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Clip Studio tiles and Cubism project zips are deflate streams
miniz_oxide = { workspace = true, optional = true }
# Cubism Editor projects keep their object graph as XML
quick-xml = { version = "0.41", optional = true }
